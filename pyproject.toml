[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-progress-bridge"
description = "Mirror selected ComfyUI execution events to an external visual progress monitor over UDP."
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shenrui Ma" }]
dependencies = []
keywords = ["comfyui", "progress", "monitoring", "custom-nodes", "udp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Repository = "https://github.com/Shenrui-Ma/ComfyUI-Progress-Bridge"
Issues = "https://github.com/Shenrui-Ma/ComfyUI-Progress-Bridge/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
